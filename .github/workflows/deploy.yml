name: CI/CD Pipeline

on:
  push:
    branches: ["BACKEND"]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.lower.outputs.image }} # On exporte le nom en minuscule
    steps:
      - uses: actions/checkout@v4

      # ÉTAPE CRUCIALE : On met le nom en minuscules ici
      - name: Lowercase image name
        id: lower
        run: echo "image=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            # On définit le nom de l'image en minuscules pour le VPS aussi
            IMAGE_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            
            # 1. Vérification de la réactivité de Docker et redémarrage si nécessaire
            echo "Vérification de l'état du service Docker..."
            if ! timeout 15 docker ps > /dev/null; then
              echo "Docker ne répond pas. Redémarrage du service..."
              sudo systemctl restart docker || systemctl restart docker
              sleep 5
            fi

            # 2. Nettoyage de l'espace disque et des conteneurs obsolètes
            echo "Arrêt et suppression de l'ancien conteneur si existant..."
            docker stop datapipe_backend || true
            docker rm datapipe_backend || true
            
            echo "Nettoyage des conteneurs arrêtés et des réseaux inutilisés..."
            docker system prune -f
            
            echo "Nettoyage des images Docker inutilisées pour libérer de l'espace..."
            docker image prune -a -f
            
            # 3. Affichage des ressources système
            echo "Espace disque disponible :"
            df -h
            echo "Mémoire RAM disponible :"
            free -m

            # S'assurer que le dossier existe
            mkdir -p ~/JUNE_HACKATON2026
            cd ~/JUNE_HACKATON2026
            
            # Écrire directement le fichier docker-compose.yml sur le VPS
            echo 'version: "3.8"
            
            services:
              backend:
                image: ${DOCKER_IMAGE}
                container_name: datapipe_backend
                restart: always
                ports:
                  - "5005:5000"
                volumes:
                  - datapipe_data:/app/instance
                  - datapipe_uploads:/app/uploads
                env_file:
                  - .env
            
            volumes:
              datapipe_data:
              datapipe_uploads:' > docker-compose.yml
            
            # Connexion au registre sur le VPS pour avoir le droit de pull
            echo "Connexion au registre GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # On passe la variable DOCKER_IMAGE directement à docker compose
            echo "Téléchargement de la nouvelle image..."
            DOCKER_IMAGE=${{ env.REGISTRY }}/$IMAGE_LOWER:latest docker compose pull
            
            echo "Démarrage de l'application..."
            DOCKER_IMAGE=${{ env.REGISTRY }}/$IMAGE_LOWER:latest docker compose up -d
            
            echo "Nettoyage final des images inutilisées..."
            docker image prune -f
            
            echo "Déploiement terminé !"

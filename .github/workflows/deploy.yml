name: CI/CD — DataPipe

on:
  push:
    branches: ["blhack", "BACKEND", "main", "Blhack_full"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install & test backend
        run: |
          cd datapipe_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./datapipe_backend
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./datapipe-app
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest

  # Déploiement VPS — s'active en mettant la variable de repo DEPLOY_ENABLED=true
  # et les secrets VPS_HOST / VPS_USER / VPS_SSH_KEY (+ VPS_PATH optionnel).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH (git pull + docker compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH || '~/JUNE_HACKATON2026' }}
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build
            docker image prune -f
